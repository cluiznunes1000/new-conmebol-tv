<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conmebol TV | Inteligência Esportiva</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header class="site-header">
     <nav class="nav-main">
        <a href="/" class="nav-logo">CONMEBOL<span>TV</span></a>
     </nav>
  </header>

  <!-- Vertice Ads Topo -->
  <div class="ad-container"><div joinadscode="Content1"></div></div>

  <!-- Nova Grade de Placares (Live Score) -->
  <div class="live-score-grid" id="liveScore">
      <div class="score-card"><span>OPE 1</span><span>JUV 0</span></div>
  </div>

  <main class="container content-wrapper">
    <section class="hero-reduced">
        <article class="hero-main-small">
            <h1>Cruzeiro avança: atuação de gala de Gerson</h1>
        </article>
        <aside class="sidebar-desktop">
            <div class="widget"><h3>Classificação / Próximos Jogos</h3></div>
            <div class="ad-container"><div joinadscode="Content2" lazyload="true"></div></div>
        </aside>
    </section>
    
    <!-- Container da Offerwall (Oculto por padrão, ativado pelo script) -->
    <div class="clever-core-ads-offerwall"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-ad-rotator"></div>
  </footer>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
