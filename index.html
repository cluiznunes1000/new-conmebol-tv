<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conmebol TV | Inteligência Esportiva</title>
  <!-- Corrigido para style.css -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
     <nav class="nav-main">
        <a href="/" class="nav-logo">CONMEBOL<span>TV</span></a>
     </nav>
  </header>

  <div class="ad-container"><div joinadscode="Content1"></div></div>

  <div class="live-score-grid">
      <div class="score-card"><strong>OPE</strong> 1 x 0 <strong>JUV</strong></div>
      <div class="score-card"><strong>HAU</strong> 0 x 0 <strong>PER</strong></div>
  </div>

  <main class="container">
    <section class="hero-reduced">
        <article class="hero-main-small" style="background: url('https://images.unsplash.com/photo-1574629810360-7efbb452718e?w=800') center/cover;">
            <div class="overlay-text">
                <h1>Cruzeiro avança: atuação de gala de Gerson</h1>
            </div>
        </article>
        
        <aside class="sidebar-desktop">
            <div class="widget">
                <h3>Classificação</h3>
                <ul><li>1. Flamengo</li><li>2. Palmeiras</li></ul>
            </div>
            <div class="ad-container"><div joinadscode="Content2" lazyload="true"></div></div>
        </aside>
    </section>
    
    <div class="clever-core-ads-offerwall"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-ad-rotator"></div>
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
